# Docker's built-in DNS server (available in every container).
# Nginx asks it for the services' addresses and re-checks every 10 seconds,
# so it always knows every running copy.
resolver 127.0.0.11 valid=10s ipv6=off;

# Log which backend copy handled each request, and how long it took
log_format upstreamlog '$remote_addr "$request" $status '
                       'upstream=$upstream_addr time=${upstream_response_time}s';

# Groups of backend copies. "resolve" keeps each group's address list in
# sync with Docker's DNS; "zone" is the shared memory that list lives in.
# After 2 failures, a copy is skipped for 10 seconds.
upstream web_app {
    zone web_app 64k;
    server web:57891 resolve max_fails=2 fail_timeout=10s;
    # least_conn;  # alternative: send each request to the least busy copy
}

upstream location_service {
    zone location_service 64k;
    server location:2212 resolve max_fails=2 fail_timeout=10s;
}

upstream sort_service {
    zone sort_service 64k;
    server sort:5527 resolve max_fails=2 fail_timeout=10s;
}

upstream spellcheck_service {
    zone spellcheck_service 64k;
    server spellcheck:3000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstreamlog;

    # Information about the original request, passed to the services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Failover: if a copy can't be reached or errors out, retry the
    # request on another copy instead of returning the error
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # For the demo: show which copy answered, in a response header
    add_header X-Upstream $upstream_addr always;

    # Location API: /api/location/states -> location service's /states
    location /api/location/ {
        proxy_pass http://location_service/;
    }

    # Everything else goes to the main web app
    location / {
        proxy_pass http://web_app;
    }
}

# Internal entry point for service-to-service calls. Port 5527 isn't
# published in docker-compose.yml, so only other containers can reach it.
server {
    listen 5527;
    access_log /var/log/nginx/access.log upstreamlog;

    proxy_connect_timeout 2s;

    # Sorting has no side effects, so it's safe to retry a failed POST on
    # another copy ("non_idempotent" allows retrying POST requests)
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;

    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://sort_service;
    }
}

# Internal entry point for spell checking (not published)
server {
    listen 3000;
    access_log /var/log/nginx/access.log upstreamlog;

    proxy_connect_timeout 2s;

    # Spell checking has no side effects, so retrying a failed POST is safe
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;

    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://spellcheck_service;
    }
}
