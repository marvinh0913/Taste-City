# Groups of servers Nginx can send requests to. For now each has one
# container; in the load balancing step, these will have several.
upstream web_app {
    server web:57891;
}

upstream location_service {
    server location:2212;
}

server {
    listen 80;

    # Information about the original request, passed to the services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Location API: /api/location/states -> location service's /states
    location /api/location/ {
        proxy_pass http://location_service/;
    }

    # Everything else goes to the main web app
    location / {
        proxy_pass http://web_app;
    }
}