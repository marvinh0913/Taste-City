services:
  # ─── Database ───────────────────────────────────────────────────────
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Keep the data between restarts
      - db-data:/var/lib/mysql
      # Create the tables the first time the database starts
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Main web app (the only service the browser uses, plus location) ──
  web:
    build: ./services/web
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:57891/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5  
    environment:
      SORT_SERVICE_URL: http://sort:5527
      SPELLCHECK_SERVICE_URL: http://spellcheck:3000
      USERS_SERVICE_URL: http://users:5000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      sort:
        condition: service_started
      spellcheck:
        condition: service_started
      users:
        condition: service_started
    restart: unless-stopped

  # ─── Internal services (reachable only by other containers) ───────────
  sort:
    build: ./services/sort
    deploy:
      replicas: 2
    healthcheck:
      # The image has no curl or Python, so use bash's built-in
      # /dev/tcp to check that the port accepts connections
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5527"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  spellcheck:
    build: ./services/spellcheck
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  users:
    build: ./services/users
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Location  ─────────────────────
  location:
    build: ./services/location
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2212/health')"]
      interval: 5s
      timeout: 3s
      retries: 5  
    restart: unless-stopped

    # ─── Entry point: the only service published to the host ──────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      location:
        condition: service_healthy
      sort:
        condition: service_healthy
      spellcheck:
        condition: service_healthy  
    restart: unless-stopped  

volumes:
  db-data:
